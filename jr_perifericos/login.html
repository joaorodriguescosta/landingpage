<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR Periféricos - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-grid">
      <a href="index.html" class="logo">
        <img src="images/logomarca.png" alt="JR Periféricos" class="logo-img">
      </a>
      <div class="nav-bar">
        <nav class="nav-grid">
          <a href="index.html" class="nav-btn">Home</a>
          <a href="about.html" class="nav-btn">About Us</a>
          <a href="order.html" class="nav-btn">Order</a>
          <a href="login.html" class="nav-btn active">Login</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="login-section">
      <form class="login-card" action="#" method="post">

        <input
          type="email"
          class="login-input"
          name="email"
          placeholder="Digite seu email"
          autocomplete="email"
        >

        <input
          type="password"
          class="login-input"
          name="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        >

        <button type="submit" class="login-btn">Button</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="footer-grid">
      <div class="footer-col">
        <h3>JR Periféricos</h3>
        <ul>
          <li>Loja numero um de periféricos do BRASIL SIL SIL</li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>AJUDA</h3>
        <ul>
          <li>Central de atendimento</li>
          <li>Forma de pagamento</li>
          <li>Entrega</li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>CONTATO</h3>
        <ul>
          <li>(31) 99761 8999</li>
          <li>Instagram: rodri_joao010</li>
        </ul>
      </div>
    </div>
  </footer>

</body>
</html>
